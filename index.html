<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine?</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
    overflow: hidden;
}

.container {
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    max-width: 400px;
}

h1 {
    color: #ff4d6d;
}

button {
    padding: 12px 25px;
    margin: 15px;
    font-size: 16px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    transition: 0.3s;
}

#yesBtn {
    background-color: #ff4d6d;
    color: white;
}

#yesBtn:hover {
    background-color: #ff1f4b;
}

#noBtn {
    background-color: #999;
    color: white;
    position: absolute;
}

.celebration {
    display: none;
    animation: fadeIn 1s ease-in-out forwards;
}

@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}
</style>
</head>

<body>

<div class="container" id="mainContent">
    <h1> Will you be my Valentine Vaish? ❤️</h1>
    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">No 😢</button>
</div>

<div class="container celebration" id="celebrationPage">
    <h1>Best Decision Ever!!! 🎉💃</h1>
    <p><strong>Shubh's forever Valentine ❤️</strong></p>
    <img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif" width="200">
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const celebration = document.getElementById("celebrationPage");
const mainContent = document.getElementById("mainContent");

let messages = [
    "Think again Duchkoo 😏",
    "Do you really want to click this? 🥺",
    "I'll give you one more chance 💕",
    "Are you sure? 👀",
    "Humph, this button doesn’t feel right 😌",
    "Maybe try the other option? 💖"
];

let messageIndex = 0;

noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

noBtn.addEventListener("click", (e) => {
    e.preventDefault();
    alert(messages[messageIndex]);
    messageIndex = (messageIndex + 1) % messages.length;
});

yesBtn.addEventListener("click", () => {
    mainContent.style.display = "none";
    celebration.style.display = "block";
});
</script>

</body>
</html>
